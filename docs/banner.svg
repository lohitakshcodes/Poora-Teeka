<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Poora Teeka — a vaccination record card with three doses stamped and the fourth left empty" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="rule" width="1200" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27.5" x2="1200" y2="27.5" stroke="#B9C9BC" stroke-width="1" opacity="0.45"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#B4342A" stroke-width="1.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#E9EDE4"/>
  <rect width="1200" height="420" fill="url(#rule)"/>
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#14231D" stroke-width="1" opacity="0.18"/>

  <!-- left column -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-size="14" letter-spacing="0.6" fill="#14231D" opacity="0.55">Anti-rabies vaccination record</text>
  </g>

  <text x="62" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#14231D" letter-spacing="-1.5">Poora Teeka</text>
  <text x="66" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#14231D" opacity="0.5">पूरा टीका</text>

  <line x1="66" y1="240" x2="130" y2="240" stroke="#1D4E89" stroke-width="3"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="18.5" fill="#14231D">
    <text x="64" y="282">Half the people who start rabies shots never finish them.</text>
    <text x="64" y="310" opacity="0.72">A vial opened for one patient is discarded eight hours later.</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#14231D" opacity="0.62">
    <text x="64" y="356">37,17,336 bites recorded in 2024</text>
    <line x1="268" y1="342" x2="268" y2="360" stroke="#14231D" stroke-width="1" opacity="0.35"/>
    <text x="288" y="356">20.8% of vials discarded</text>
    <line x1="448" y1="342" x2="448" y2="360" stroke="#14231D" stroke-width="1" opacity="0.35"/>
    <text x="468" y="356">8-hour window</text>
  </g>

  <!-- right column: the dose card -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="720" y="102" font-size="13.5" fill="#14231D" opacity="0.55">Course of four doses</text>

    <!-- dose 1 -->
    <rect x="720" y="120" width="88" height="88" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="720" y="120" width="88" height="88" rx="3" fill="none" stroke="#14231D" stroke-width="1.2" opacity="0.3"/>
    <g transform="translate(764 164) rotate(-9)">
      <rect x="-31" y="-19" width="62" height="38" rx="4" fill="none" stroke="#1D4E89" stroke-width="2" opacity="0.85"/>
      <path d="M -13 2 L -4 11 L 14 -9" fill="none" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <text x="764" y="228" font-size="12.5" fill="#14231D" opacity="0.7" text-anchor="middle">Day 0</text>

    <!-- dose 2 -->
    <rect x="824" y="120" width="88" height="88" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="824" y="120" width="88" height="88" rx="3" fill="none" stroke="#14231D" stroke-width="1.2" opacity="0.3"/>
    <g transform="translate(868 164) rotate(6)">
      <rect x="-31" y="-19" width="62" height="38" rx="4" fill="none" stroke="#1D4E89" stroke-width="2" opacity="0.85"/>
      <path d="M -13 2 L -4 11 L 14 -9" fill="none" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <text x="868" y="228" font-size="12.5" fill="#14231D" opacity="0.7" text-anchor="middle">Day 3</text>

    <!-- dose 3 -->
    <rect x="928" y="120" width="88" height="88" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="928" y="120" width="88" height="88" rx="3" fill="none" stroke="#14231D" stroke-width="1.2" opacity="0.3"/>
    <g transform="translate(972 164) rotate(-4)">
      <rect x="-31" y="-19" width="62" height="38" rx="4" fill="none" stroke="#1D4E89" stroke-width="2" opacity="0.85"/>
      <path d="M -13 2 L -4 11 L 14 -9" fill="none" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <text x="972" y="228" font-size="12.5" fill="#14231D" opacity="0.7" text-anchor="middle">Day 7</text>

    <!-- dose 4: the empty one -->
    <rect x="1032" y="120" width="88" height="88" rx="3" fill="url(#hatch)" opacity="0.5"/>
    <rect x="1032" y="120" width="88" height="88" rx="3" fill="none" stroke="#B4342A" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="1076" y="228" font-size="12.5" fill="#B4342A" text-anchor="middle">Day 28</text>

    <!-- the vial window bar -->
    <text x="720" y="288" font-size="13.5" fill="#14231D" opacity="0.55">One opened vial, eight hours</text>
    <rect x="720" y="300" width="400" height="16" rx="8" fill="#14231D" opacity="0.1"/>
    <rect x="720" y="300" width="80" height="16" rx="8" fill="#C97A16"/>
    <rect x="806" y="300" width="314" height="16" rx="8" fill="url(#hatch)" opacity="0.55"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#14231D" opacity="0.62">
      <text x="720" y="340">Used by one patient</text>
      <text x="1120" y="340" text-anchor="end">Four doses discarded</text>
    </g>
  </g>
</svg>
