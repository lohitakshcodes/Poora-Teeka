<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="Diagram comparing one vial used by a single patient against the same vial shared by five patients within its eight-hour window" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="waste" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#E06A5E" stroke-width="1.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1100" height="380" rx="6" fill="#101A17"/>
  <rect x="0.5" y="0.5" width="1099" height="379" rx="6" fill="none" stroke="#34473F"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#E8EDE9">
    <text x="48" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="26">What happens to one opened vial</text>
    <text x="48" y="84" font-size="14" opacity="0.55">A reconstituted intradermal vial holds five patient doses and lasts eight hours.</text>

    <!-- row 1 -->
    <text x="48" y="146" font-size="15" opacity="0.85">Without coordination</text>
    <rect x="48" y="160" width="900" height="34" rx="4" fill="#E8EDE9" opacity="0.08"/>
    <rect x="48" y="160" width="180" height="34" rx="4" fill="#E0A040"/>
    <rect x="234" y="160" width="714" height="34" rx="4" fill="url(#waste)" opacity="0.6"/>
    <g font-size="12.5" fill="#101A17">
      <text x="138" y="182" text-anchor="middle" font-weight="bold">1 dose</text>
    </g>
    <text x="966" y="182" font-size="13.5" fill="#E06A5E">4 discarded</text>

    <!-- row 2 -->
    <text x="48" y="248" font-size="15" opacity="0.85">With batched arrival slots</text>
    <rect x="48" y="262" width="900" height="34" rx="4" fill="#E8EDE9" opacity="0.08"/>
    <rect x="48" y="262" width="180" height="34" rx="4" fill="#E0A040"/>
    <rect x="234" y="262" width="174" height="34" rx="4" fill="#E0A040"/>
    <rect x="414" y="262" width="174" height="34" rx="4" fill="#E0A040"/>
    <rect x="594" y="262" width="174" height="34" rx="4" fill="#E0A040"/>
    <rect x="774" y="262" width="174" height="34" rx="4" fill="#E0A040"/>
    <g font-size="12.5" fill="#101A17" font-weight="bold">
      <text x="138" y="284" text-anchor="middle">1</text>
      <text x="321" y="284" text-anchor="middle">2</text>
      <text x="501" y="284" text-anchor="middle">3</text>
      <text x="681" y="284" text-anchor="middle">4</text>
      <text x="861" y="284" text-anchor="middle">5</text>
    </g>
    <text x="966" y="284" font-size="13.5" fill="#6FCF97">0 discarded</text>

    <!-- time axis -->
    <line x1="48" y1="322" x2="948" y2="322" stroke="#34473F" stroke-width="1"/>
    <g font-size="12" opacity="0.5">
      <text x="48" y="344">9 am</text>
      <text x="273" y="344" text-anchor="middle">11 am</text>
      <text x="498" y="344" text-anchor="middle">1 pm</text>
      <text x="723" y="344" text-anchor="middle">3 pm</text>
      <text x="948" y="344" text-anchor="end">5 pm</text>
    </g>
    <text x="48" y="368" font-size="12.5" opacity="0.45">Dose days are fixed by the protocol. Only the time of day is ours to schedule.</text>
  </g>
</svg>
